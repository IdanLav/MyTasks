<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MyTasks">
  <meta name="theme-color" content="#4A90D9">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>MyTasks</title>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:   #4A90D9;
      --yellow: #F5A623;
      --green:  #5CB85C;
      --orange: #E87A2B;
      --red:    #D9534F;
      --gray:   #8E8E93;
      --bg:     #F2F2F7;
      --card:   #FFFFFF;
      --border: #E5E5EA;
      --text:   #1C1C1E;
      --sub:    #6D6D72;
      --note-bg: #FFFEF5;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      height: 100%; width: 100%;
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ===== LAYOUT ===== */
    #app {
      display: flex; flex-direction: column;
      height: 100dvh; max-width: 430px; margin: 0 auto;
    }
    header {
      background: var(--card);
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    header h1 { font-size: 22px; font-weight: 700; color: var(--blue); letter-spacing: -0.5px; }
    .header-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: none; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px;
    }
    main {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 12px 0 calc(var(--safe-bot) + 80px);
    }

    /* ===== INPUT BAR ===== */
    .input-bar {
      position: fixed; bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 430px;
      background: var(--card); border-top: 1px solid var(--border);
      padding: 10px 16px calc(var(--safe-bot) + 10px);
      z-index: 200;
    }
    .input-row { display: flex; gap: 8px; align-items: center; }
    .task-input {
      flex: 1; padding: 10px 14px;
      border: 1.5px solid var(--border); border-radius: 22px;
      font-size: 16px; font-family: inherit;
      direction: rtl; text-align: right;
      background: var(--bg); outline: none; transition: border-color .2s;
    }
    .task-input:focus { border-color: var(--blue); }
    .task-input::placeholder { color: var(--sub); }
    .btn-icon {
      width: 44px; height: 44px; border-radius: 50%;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
      transition: transform .15s, opacity .15s;
    }
    .btn-icon:active { transform: scale(0.92); }
    .btn-mic { background: #EEF4FF; color: var(--blue); }
    .btn-mic.recording { background: var(--red); color: #fff; animation: pulse 1s infinite; }
    .btn-add { background: var(--blue); color: #fff; }
    .btn-add.note-mode { background: var(--yellow); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }

    /* ===== VIEW TOGGLE ===== */
    .view-toggle {
      display: flex; background: var(--border);
      border-radius: 10px; margin: 12px 16px 8px; padding: 2px;
    }
    .view-btn {
      flex: 1; padding: 6px 2px;
      border: none; background: transparent; border-radius: 8px;
      font-size: 12px; font-weight: 500; cursor: pointer;
      color: var(--sub); transition: all .2s; white-space: nowrap;
    }
    .view-btn.active { background: var(--card); color: var(--blue); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .view-btn.active.notes-active { color: var(--yellow); }

    /* ===== CALENDAR NAV ===== */
    .cal-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 16px;
    }
    .cal-nav h2 { font-size: 17px; font-weight: 600; }
    .nav-arrow {
      width: 34px; height: 34px; border: none; background: var(--bg);
      border-radius: 50%; cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }

    /* ===== WEEK VIEW ===== */
    .week-grid { padding: 8px 16px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .day-label { font-size: 11px; color: var(--sub); font-weight: 500; }
    .day-num {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 500; cursor: pointer; transition: background .15s;
    }
    .day-num.today { background: var(--blue); color: #fff; font-weight: 700; }
    .day-num.selected { background: #EEF4FF; color: var(--blue); font-weight: 700; }
    .day-dot-row { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; min-height: 6px; }
    .day-dot { width: 6px; height: 6px; border-radius: 50%; }

    /* ===== MONTH VIEW ===== */
    .month-grid { padding: 0 16px; }
    .month-dow-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
    .month-dow { font-size: 11px; color: var(--sub); text-align: center; font-weight: 500; padding: 2px 0; }
    .month-days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .month-cell {
      aspect-ratio: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 2px; cursor: pointer; border-radius: 8px; transition: background .15s;
    }
    .month-cell .mn { font-size: 13px; font-weight: 500; padding: 2px 0; }
    .month-cell.today .mn { background: var(--blue); color: #fff; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
    .month-cell.selected .mn { background: #EEF4FF; color: var(--blue); border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
    .month-cell.other-month .mn { color: var(--border); }
    .month-cell .mdots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; }
    .month-cell .mdot { width: 5px; height: 5px; border-radius: 50%; }


    /* ===== SECTION HEADER ===== */
    .section-header {
      padding: 10px 16px 6px;
      font-size: 13px; font-weight: 600; color: var(--sub);
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* ===== TASK CARDS ===== */
    .task-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
    .task-card {
      background: var(--card); border-radius: 14px;
      border-right: 4px solid var(--gray); padding: 12px 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      display: flex; align-items: flex-start; gap: 10px;
      cursor: pointer; transition: transform .15s;
    }
    .task-card:active { transform: scale(0.98); }
    .task-card.done { opacity: .5; }
    .task-card.done .task-title { text-decoration: line-through; }
    .task-check {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--border); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px; cursor: pointer; transition: all .2s;
    }
    .task-check.checked { background: var(--green); border-color: var(--green); color: #fff; }
    .task-body { flex: 1; min-width: 0; }
    .task-title { font-size: 15px; font-weight: 500; word-break: break-word; }
    .task-meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
    .task-tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; color: #fff; }
    .task-time { font-size: 12px; color: var(--sub); }
    .task-link { font-size: 12px; color: var(--blue); text-decoration: none; }
    .task-actions { display: flex; gap: 4px; align-items: center; }
    .action-btn {
      width: 30px; height: 30px; border-radius: 50%; border: none;
      background: var(--bg); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: var(--sub); transition: background .15s;
    }

    /* ===== NOTE CARDS ===== */
    .note-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
    .note-card {
      background: var(--note-bg); border-radius: 14px;
      border-right: 4px solid var(--yellow); padding: 12px 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      display: flex; align-items: flex-start; gap: 10px;
      cursor: pointer; transition: transform .15s;
    }
    .note-card:active { transform: scale(0.98); }
    .note-icon { font-size: 22px; flex-shrink: 0; margin-top: 1px; }
    .note-body { flex: 1; min-width: 0; }
    .note-card-title {
      font-size: 15px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .note-card-preview {
      font-size: 13px; color: var(--sub); margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .note-card-meta { font-size: 11px; color: #c7c7cc; margin-top: 5px; }
    .note-sketch-thumb {
      width: 54px; height: 54px; border-radius: 10px;
      object-fit: cover; border: 1px solid var(--border); flex-shrink: 0;
    }

    /* ===== SHARED MODAL ===== */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 500; display: flex; align-items: flex-end; justify-content: center;
      animation: fadeIn .2s;
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .modal {
      background: var(--card); width: 100%; max-width: 430px;
      border-radius: 24px 24px 0 0;
      padding: 20px 20px calc(var(--safe-bot) + 20px);
      animation: slideUp .25s ease-out;
      max-height: 92dvh; overflow-y: auto;
    }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
    .modal h2 { font-size: 19px; font-weight: 700; margin-bottom: 20px; }
    /* ===== DATES BLOCK ===== */
    .dates-block {
      background: var(--bg); border-radius: 14px;
      padding: 4px 0; margin-bottom: 16px;
      border: 1.5px solid var(--border);
      overflow: hidden;
    }
    .date-row {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-bottom: 1px solid var(--border);
    }
    .date-row:last-child { border-bottom: none; }
    .date-icon { font-size: 18px; flex-shrink: 0; }
    .date-col { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .date-label { font-size: 11px; font-weight: 600; color: var(--sub); }
    .date-value { font-size: 14px; color: var(--text); }
    .date-input {
      width: 100%; border: none; background: transparent;
      font-size: 14px; font-family: inherit; color: var(--text);
      direction: rtl; text-align: right; outline: none; padding: 0;
    }
    .date-input::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }

    .field { margin-bottom: 16px; }
    .field label { font-size: 13px; font-weight: 600; color: var(--sub); display: block; margin-bottom: 6px; }
    .field input, .field textarea, .field select {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 16px; font-family: inherit;
      direction: rtl; text-align: right;
      background: var(--bg); color: var(--text);
      outline: none; transition: border-color .2s;
    }
    .field input:focus, .field textarea:focus { border-color: var(--blue); }
    .field textarea { min-height: 80px; resize: vertical; }
    .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .color-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .color-swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; transition: all .15s; }
    .color-opt.selected .color-swatch { border-color: var(--text); transform: scale(1.1); }
    .color-opt span { font-size: 10px; color: var(--sub); text-align: center; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-primary {
      flex: 1; padding: 14px; border: none; border-radius: 14px;
      background: var(--blue); color: #fff;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    .btn-primary:active { opacity: .8; }
    .btn-secondary {
      padding: 14px 20px; border: 1.5px solid var(--border); border-radius: 14px;
      background: transparent; color: var(--sub);
      font-size: 16px; font-weight: 500; cursor: pointer; font-family: inherit;
    }
    .btn-danger {
      padding: 14px 20px; border: none; border-radius: 14px;
      background: #FFF0F0; color: var(--red);
      font-size: 16px; font-weight: 500; cursor: pointer; font-family: inherit;
    }

    /* ===== NOTE MODAL ===== */
    .note-modal { max-height: 95dvh; }
    .note-modal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .note-modal-top h2 { margin-bottom: 0; }
    .note-tab-bar {
      display: flex; background: var(--border);
      border-radius: 10px; padding: 2px; margin-bottom: 14px;
    }
    .note-tab {
      flex: 1; padding: 9px 4px;
      border: none; background: transparent; border-radius: 8px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      color: var(--sub); transition: all .2s; font-family: inherit;
    }
    .note-tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .note-tab-content { min-height: 260px; }
    .note-text-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
    }
    .note-mic-label { font-size: 12px; color: var(--sub); }
    .note-textarea {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--border); border-radius: 12px;
      font-size: 16px; font-family: inherit; line-height: 1.65;
      direction: rtl; text-align: right;
      background: var(--bg); color: var(--text);
      outline: none; resize: none; min-height: 230px;
      transition: border-color .2s;
    }
    .note-textarea:focus { border-color: var(--blue); }

    /* ===== SKETCH ===== */
    .sketch-toolbar {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px; flex-wrap: wrap;
    }
    .sketch-tool {
      min-width: 36px; height: 36px; padding: 0 8px; border-radius: 10px;
      border: 1.5px solid var(--border); background: var(--bg);
      cursor: pointer; font-size: 16px; font-family: inherit;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .sketch-tool.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .sketch-colors { display: flex; gap: 7px; align-items: center; }
    .sketch-color {
      width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: all .15s; flex-shrink: 0;
    }
    .sketch-color.active { border-color: var(--text); transform: scale(1.2); }
    .sketch-sizes { display: flex; gap: 4px; }
    .sketch-size {
      width: 30px; height: 30px; border-radius: 8px;
      border: 1.5px solid var(--border); background: var(--bg);
      cursor: pointer; font-weight: 700; color: var(--sub);
      font-family: inherit; transition: all .15s;
    }
    .sketch-size.active { background: #EEF4FF; border-color: var(--blue); color: var(--blue); }
    .sketch-clear {
      margin-right: auto; padding: 0 10px; height: 34px;
      border-radius: 10px; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--sub);
      cursor: pointer; font-size: 13px; font-family: inherit;
    }
    .sketch-canvas {
      width: 100%; border-radius: 12px;
      border: 1.5px solid var(--border); background: #fff;
      cursor: crosshair; touch-action: none; display: block;
    }

    /* ===== EMPTY STATE ===== */
    /* ===== INSTALL BANNER ===== */
    .install-banner {
      background: linear-gradient(135deg, #4A90D9, #2C5F8A);
      color: #fff; padding: 12px 16px;
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 13px; line-height: 1.5;
    }
    .install-banner-icon { font-size: 24px; flex-shrink: 0; }
    .install-banner-body { flex: 1; }
    .install-banner-title { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
    .install-banner-close {
      background: rgba(255,255,255,.2); border: none; border-radius: 50%;
      color: #fff; width: 26px; height: 26px; cursor: pointer;
      font-size: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }

    /* ===== RECURRENCE BAR ===== */
    .recurrence-bar {
      display: flex; gap: 0; background: var(--border);
      border-radius: 10px; padding: 2px;
    }
    .rec-btn {
      flex: 1; padding: 7px 4px; border: none; background: transparent;
      border-radius: 8px; font-size: 12px; font-weight: 500;
      cursor: pointer; color: var(--sub); transition: all .2s;
      font-family: inherit;
    }
    .rec-btn.active { background: var(--card); color: var(--blue); box-shadow: 0 1px 4px rgba(0,0,0,.1); }

    .recur-range { margin-top: 10px; }
    .recur-preview {
      margin-top: 8px; padding: 8px 12px;
      background: #EEF4FF; border-radius: 10px;
      font-size: 13px; color: var(--blue); font-weight: 500;
      display: none;
    }
    .recur-preview.visible { display: block; }

    /* ===== HEADER BUTTONS ===== */
    .header-actions { display: flex; gap: 6px; }

    /* ===== RECURRENCE BADGE on card ===== */
    .rec-badge {
      font-size: 11px; color: var(--blue); background: #EEF4FF;
      padding: 2px 7px; border-radius: 8px; font-weight: 600;
    }

    .empty { text-align: center; padding: 40px 16px; color: var(--sub); }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }
    .empty p { font-size: 16px; }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: calc(var(--safe-bot) + 80px); left: 50%;
      transform: translateX(-50%);
      background: rgba(30,30,30,.9); color: #fff;
      padding: 10px 20px; border-radius: 20px;
      font-size: 14px; z-index: 999; pointer-events: none;
      animation: toastIn .3s, toastOut .3s 1.7s forwards;
    }
    @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
    @keyframes toastOut { to{opacity:0} }

    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>MyTasks ✓</h1>
    <div class="header-actions">
      <button class="header-btn" id="export-btn" title="גיבוי נתונים">💾</button>
      <button class="header-btn" id="notif-btn" title="הפעל התראות">🔔</button>
    </div>
  </header>
  <div id="install-banner-slot"></div>
  <main id="main-content"></main>
  <div class="input-bar">
    <div class="input-row">
      <button class="btn-icon btn-mic" id="mic-btn" title="הקלטת קול">🎤</button>
      <input class="task-input" id="task-input" type="text"
        placeholder="משימה חדשה..."
        autocomplete="off" autocorrect="off" spellcheck="true" lang="he">
      <button class="btn-icon btn-add" id="add-btn" title="הוסף">+</button>
    </div>
  </div>
</div>

<script>
// ===== CONSTANTS =====
const CATS = [
  { id: 'work',     label: 'עבודה',  color: '#4A90D9', emoji: '💼' },
  { id: 'sports',   label: 'ספורט',  color: '#F5A623', emoji: '⚽' },
  { id: 'food',     label: 'אוכל',   color: '#5CB85C', emoji: '🍎' },
  { id: 'event',    label: 'אירוע',  color: '#E87A2B', emoji: '🎉' },
  { id: 'personal', label: 'אישי',   color: '#D9534F', emoji: '❤️' },
];
const CAT_MAP = Object.fromEntries(CATS.map(c => [c.id, c]));
const DOW = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const MONTHS_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const RECUR = [
  { id: null,       label: 'ללא'   },
  { id: 'daily',    label: 'יומי'  },
  { id: 'weekly',   label: 'שבועי' },
  { id: 'monthly',  label: 'חודשי' },
  { id: 'yearly',   label: 'שנתי'  },
];

// ===== STATE =====
let tasks      = JSON.parse(localStorage.getItem('mytasks_tasks')  || '[]');
let notes      = JSON.parse(localStorage.getItem('mytasks_notes')  || '[]');
let firedNotifs = JSON.parse(localStorage.getItem('mytasks_fired') || '{}');
let view       = localStorage.getItem('mytasks_view') || 'week';
let selectedDate = new Date();
let calOffset = 0;
let editingTaskId = null;
let editingNoteId = null;
let swReg = null;

// sketch state
let sketchCtx = null;
let sketchInitialized = false;
let isDrawing = false;
let lastPos = null;
let sketchPenColor = '#1C1C1E';

const nextOccurrence = (isoDate, recurrence) => {
  if (!isoDate || !recurrence) return null;
  const d = new Date(isoDate);
  if (recurrence === 'daily')   d.setDate(d.getDate() + 1);
  if (recurrence === 'weekly')  d.setDate(d.getDate() + 7);
  if (recurrence === 'monthly') d.setMonth(d.getMonth() + 1);
  if (recurrence === 'yearly')  d.setFullYear(d.getFullYear() + 1);
  return d.toISOString();
};

const generateOccurrences = (startISO, endDateStr, recurrence) => {
  const dates = [];
  const current = new Date(startISO);
  const endDate = new Date(endDateStr + 'T23:59:59');
  let limit = 400;
  while (current <= endDate && limit-- > 0) {
    if (current.getDay() !== 6) dates.push(new Date(current).toISOString());
    if (recurrence === 'daily')        current.setDate(current.getDate() + 1);
    else if (recurrence === 'weekly')  current.setDate(current.getDate() + 7);
    else if (recurrence === 'monthly') current.setMonth(current.getMonth() + 1);
    else if (recurrence === 'yearly')  current.setFullYear(current.getFullYear() + 1);
    else break;
  }
  return dates;
};

// ===== UTILS =====
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const today   = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const sameDay = (a, b) =>

const fmtDate = d => d ? new Date(d).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
const fmtTime = d => d ? new Date(d).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}) : '';
const fmtDateTime = d => d ? `${fmtDate(d)} ${fmtTime(d)}` : '';
const escHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const getWeekStart = (off=0) => {
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - d.getDay() + off * 7); return d;
};
const getMonthStart = (off=0) => {
  const d = new Date(); return new Date(d.getFullYear(), d.getMonth() + off, 1);
};

// ===== NOTIFICATIONS =====
const pendingNotifs = {}; // taskId → timeoutId
const isPwa = () => window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
const isIos = () => /iPhone|iPad|iPod/.test(navigator.userAgent);

const fireNotif = (title, opts) => {
  if (swReg) return swReg.showNotification(title, opts);
  if ('Notification' in window && Notification.permission === 'granted') return new Notification(title, opts);
};

// Fires any notifications missed while app was closed (up to 24h back)
const checkOverdueNotifs = () => {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = Date.now();
  const DAY = 24 * 60 * 60 * 1000;
  let changed = false;
  tasks.forEach(t => {
    if (t.done) return;
    const alertDate = t.notifDate || t.dueDate;
    if (!alertDate) return;
    const alertTs = new Date(alertDate).getTime();
    if (alertTs > now || alertTs < now - DAY) return; // future or too old
    const key = `${t.id}@${alertTs}`;
    if (firedNotifs[key]) return; // already fired
    firedNotifs[key] = now; changed = true;
    const body = (t.category ? `[${CAT_MAP[t.category]?.label}] ` : '') + fmtDateTime(alertDate);
    fireNotif('⏰ ' + t.title, {
      body, icon: '/icons/icon-192.png', badge: '/icons/icon-192.png',
      requireInteraction: true, vibrate: [300,100,300,100,300,100,600],
      tag: `task-${t.id}`, renotify: true
    });
  });
  if (changed) saveFired();
  // Prune entries older than 2 days
  const cutoff = now - 2 * DAY;
  Object.keys(firedNotifs).forEach(k => { if (firedNotifs[k] < cutoff) delete firedNotifs[k]; });
};

const scheduleNotif = task => {
  const alertDate = task.notifDate || task.dueDate;
  if (!alertDate || task.done) return;
  if (pendingNotifs[task.id]) clearTimeout(pendingNotifs[task.id]);
  const delay = new Date(alertDate).getTime() - Date.now();
  if (delay <= 0) return;

  pendingNotifs[task.id] = setTimeout(() => {
    delete pendingNotifs[task.id];
    if (Notification.permission !== 'granted') return;
    const key = `${task.id}@${new Date(alertDate).getTime()}`;
    if (firedNotifs[key]) return;
    firedNotifs[key] = Date.now(); saveFired();
    const body = (task.category ? `[${CAT_MAP[task.category]?.label}] ` : '') + fmtDateTime(alertDate);
    const base = { body, icon: '/icons/icon-192.png', badge: '/icons/icon-192.png', requireInteraction: true, vibrate: [300,100,300,100,300,100,600], renotify: true };
    fireNotif('⏰ ' + task.title, { ...base, tag: `t-${task.id}-1` });
    setTimeout(() => fireNotif('🔔🔔 ' + task.title, { ...base, tag: `t-${task.id}-2` }), 5000);
    setTimeout(() => fireNotif('‼️ ' + task.title + ' ‼️', { ...base, tag: `t-${task.id}-3` }), 10000);
    // Auto-schedule next occurrence for recurring tasks
    if (task.recurrence) {
      task.dueDate   = nextOccurrence(task.dueDate,   task.recurrence);
      task.notifDate = nextOccurrence(task.notifDate, task.recurrence);
      save(); scheduleNotif(task); renderAll();
    }
  }, delay);
};

const cancelNotif = id => {
  if (pendingNotifs[id]) { clearTimeout(pendingNotifs[id]); delete pendingNotifs[id]; }
};

const requestNotifPermission = async () => {
  if (!('Notification' in window)) {
    if (isIos() && !isPwa()) showInstallBanner();
    else showToast('התראות לא נתמכות בדפדפן זה');
    return;
  }
  if (isIos() && !isPwa()) { showInstallBanner(); return; }
  const p = await Notification.requestPermission();
  if (p === 'granted') {
    showToast('התראות הופעלו ✓');
    checkOverdueNotifs();
    tasks.forEach(t => { if ((t.notifDate || t.dueDate) && !t.done) scheduleNotif(t); });
  } else if (p === 'denied') {
    showToast('חסומות — אפשר בהגדרות האייפון ← Safari ← התראות');
  } else {
    showToast('יש לאשר התראות');
  }
};

// Check every 30 seconds while app is open
setInterval(checkOverdueNotifs, 30000);

// On focus/foreground restore
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    checkOverdueNotifs();
    if (Notification.permission === 'granted') {
      tasks.forEach(t => { if ((t.notifDate || t.dueDate) && !t.done) scheduleNotif(t); });
    }
  }
});

const exportData = () => {

  const a = document.createElement('a');

// ===== VOICE (main bar) =====
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn   = document.getElementById('mic-btn');
const taskInput = document.getElementById('task-input');

if (SpeechRec) {
  recognition = new SpeechRec();
  recognition.lang = 'he-IL';
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onresult = e => {
    const t = Array.from(e.results).map(r => r[0].transcript).join('');
    if (recognitionTarget === 'note') {
      const ta = document.getElementById('note-textarea');
      if (ta) ta.value = t;
    } else {
      taskInput.value = t;
    }
  };
  recognition.onend = () => {
    micBtn.classList.remove('recording');
    const nm = document.getElementById('note-mic-btn');
    if (nm) nm.classList.remove('recording');

    const shouldSubmit = voiceAutoSubmit;
    const target       = recognitionTarget;
    voiceAutoSubmit    = false;
    recognitionTarget  = 'task';

    if (shouldSubmit) {
      if (target === 'note') {
        // Auto-save the note modal
        saveNote();
      } else {
        // Auto-create task or note from input bar
        if (taskInput.value.trim()) {
          view === 'notes' ? addNote() : addTask();
        }
      }
    }
  };
  recognition.onerror = () => {
    micBtn.classList.remove('recording');
    const nm = document.getElementById('note-mic-btn');
    if (nm) nm.classList.remove('recording');
    voiceAutoSubmit = false; recognitionTarget = 'task';
    showToast('שגיאה בזיהוי קול');
  };

  micBtn.addEventListener('click', () => {
    if (micBtn.classList.contains('recording')) {
      voiceAutoSubmit = true;
      recognition.stop();
    } else {
      recognitionTarget = 'task'; voiceAutoSubmit = false;
      micBtn.classList.add('recording');
      try { recognition.start(); } catch(e) {}
    }
  });
} else {
  micBtn.style.opacity = '0.4';
  micBtn.title = 'זיהוי קול לא נתמך';
}

// Note modal mic
const toggleNoteMic = () => {
  if (!recognition) { showToast('זיהוי קול לא נתמך'); return; }
  const btn = document.getElementById('note-mic-btn');
  if (btn.classList.contains('recording')) {
    voiceAutoSubmit = true;
    recognition.stop();
  } else {
    recognitionTarget = 'note'; voiceAutoSubmit = false;
    btn.classList.add('recording');
    try { recognition.start(); } catch(e) {}
  }
};

// ===== TASKS =====
const addTask = () => {
  const title = taskInput.value.trim();
  if (!title) { taskInput.focus(); return; }
  const now = new Date().toISOString();
  const task = { id: uid(), title, dueDate: now, notifDate: null, recurrence: null, category: null, color: null, link: '', done: false, createdAt: now };
  tasks.unshift(task);
  save(); taskInput.value = '';
  renderAll(); showToast('משימה נוספה – לחץ לעריכה ✓');
};
const deleteTask = id => { cancelNotif(id); tasks = tasks.filter(t => t.id !== id); save(); renderAll(); showToast('משימה נמחקה'); };
const toggleDone = (id, e) => {
  e.stopPropagation();
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  if (!t.done && t.recurrence) {
    // Mark current as done, spawn next occurrence
    t.done = true;
    const next = {
      id: uid(), title: t.title,
      dueDate:   nextOccurrence(t.dueDate,   t.recurrence),
      notifDate: nextOccurrence(t.notifDate, t.recurrence),
      recurrence: t.recurrence,
      category: t.category, color: t.color, link: t.link,
      done: false, createdAt: new Date().toISOString(),
    };
    tasks.unshift(next);
    scheduleNotif(next);
    showToast('✓ הושלמה · המשימה הבאה נוצרה אוטומטית');
  } else {
    t.done = !t.done;
    if (t.done) cancelNotif(t.id);
    else scheduleNotif(t);
  }
  save(); renderAll();
};

  });

};
const closeModal = () => { document.getElementById('modal-bd')?.remove(); editingTaskId = null; };
const setRecurrence = btn => {
  document.querySelectorAll('.rec-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const isRecur = btn.dataset.recur !== 'null' && btn.dataset.recur !== '';
  const rangeWrap = document.getElementById('recur-range-wrap');
  if (rangeWrap) rangeWrap.style.display = isRecur ? '' : 'none';
  updateRecurPreview();
};

const updateRecurPreview = () => {
  const preview = document.getElementById('recur-preview');
  if (!preview) return;
  const recurEl  = document.querySelector('.rec-btn.active');
  const recurVal = recurEl?.dataset.recur;
  const recur    = (!recurVal || recurVal === 'null') ? null : recurVal;
  const endVal   = document.getElementById('m-recur-end')?.value;
  const dateVal  = document.getElementById('m-date')?.value;
  if (!recur || !endVal || !dateVal) { preview.classList.remove('visible'); return; }
  const dates = generateOccurrences(new Date(dateVal).toISOString(), endVal, recur);
  preview.textContent = `יוצר ${dates.length} משימות (א׳–ו׳, ללא שבת)`;
  preview.classList.toggle('visible', dates.length > 0);
};
const selectCat = id => {
  document.querySelectorAll('.color-opt').forEach(el => el.classList.toggle('selected', el.dataset.cat === id));
};
const saveTask = () => {
  const title    = document.getElementById('m-title').value.trim();
  if (!title) { showToast('יש להזין כותרת'); return; }
  const dateVal  = document.getElementById('m-date').value;
  const notifVal = document.getElementById('m-notif').value;
  const link     = document.getElementById('m-link').value.trim();
  const catEl    = document.querySelector('.color-opt.selected');
  const catId    = catEl ? catEl.dataset.cat : null;
  const recurEl  = document.querySelector('.rec-btn.active');
  const recurVal = recurEl?.dataset.recur;
  const recur    = (!recurVal || recurVal === 'null') ? null : recurVal;
  const endVal   = document.getElementById('m-recur-end')?.value;

  if (recur && endVal && dateVal) {
    const startISO = new Date(dateVal).toISOString();
    const dates    = generateOccurrences(startISO, endVal, recur);
    if (!dates.length) { showToast('אין תאריכים בטווח זה'); return; }
    if (editingTaskId) { cancelNotif(editingTaskId); tasks = tasks.filter(t => t.id !== editingTaskId); }
    const notifOffset = (notifVal && dateVal)
      ? new Date(notifVal).getTime() - new Date(dateVal).getTime()
      : null;
    const now = new Date().toISOString();
    const newTasks = dates.map(iso => ({
      id: uid(), title, link,
      category: catId, color: catId ? CAT_MAP[catId].color : null,
      recurrence: null, done: false, createdAt: now,
      dueDate: iso,
      notifDate: notifOffset !== null ? new Date(new Date(iso).getTime() + notifOffset).toISOString() : null,
    }));
    tasks = [...newTasks, ...tasks];
    save();
    newTasks.forEach(t => scheduleNotif(t));
    closeModal(); renderAll();
    showToast(`נוצרו ${newTasks.length} משימות ✓`);
    return;
  }

  let task = tasks.find(t => t.id === editingTaskId);
  if (!task) { task = { id: uid(), createdAt: new Date().toISOString(), done: false }; tasks.unshift(task); }
  task.title      = title;
  task.dueDate    = dateVal  ? new Date(dateVal).toISOString()  : null;
  task.notifDate  = notifVal ? new Date(notifVal).toISOString() : null;
  task.recurrence = recur;
  task.link       = link;
  task.category   = catId;
  task.color      = catId ? CAT_MAP[catId].color : null;
  save();
  scheduleNotif(task);
  closeModal(); renderAll(); showToast('נשמר ✓');
};
const deleteTaskFromModal = () => { if (editingTaskId) { deleteTask(editingTaskId); closeModal(); } };

        <div class="note-tab-bar">
          <button class="note-tab"        data-tab="text"   onclick="switchNoteTab('text')">✏️ כתיבה / קול</button>
          <button class="note-tab active" data-tab="sketch" onclick="switchNoteTab('sketch')">🎨 סקיצה</button>
        </div>

        <!-- TEXT / VOICE TAB -->
        <div id="note-tab-text" class="note-tab-content" style="display:none">
          <div class="note-text-header">
            <button class="btn-icon btn-mic" id="note-mic-btn" onclick="toggleNoteMic()" title="דקלום קולי">🎤</button>
            <span class="note-mic-label">לחץ לדקלום קולי בעברית</span>
          </div>
          <textarea id="note-textarea" class="note-textarea" placeholder="כתוב את הפתק כאן...">${escHtml(note.content||'')}</textarea>
        </div>

        <!-- SKETCH TAB -->
        <div id="note-tab-sketch" class="note-tab-content">
          <div class="sketch-toolbar">
            <button class="sketch-tool ${sketchMode==='pen'?'active':''}"    id="sk-pen"    onclick="setSketchMode('pen')">✏️</button>
            <button class="sketch-tool ${sketchMode==='eraser'?'active':''}" id="sk-eraser" onclick="setSketchMode('eraser')">🧹</button>
            <div class="sketch-colors">
              ${['#1C1C1E','#4A90D9','#D9534F','#5CB85C','#F5A623'].map(c =>
                `<div class="sketch-color${sketchPenColor===c?' active':''}" style="background:${c}" onclick="setSketchColor('${c}')"></div>`
              ).join('')}
            </div>
            <div class="sketch-sizes">
              <button class="sketch-size${sketchPenSize===2?' active':''}" onclick="setSketchSize(2)">S</button>
              <button class="sketch-size${sketchPenSize===4?' active':''}" onclick="setSketchSize(4)">M</button>
              <button class="sketch-size${sketchPenSize===8?' active':''}" onclick="setSketchSize(8)">L</button>
            </div>
            <button class="sketch-clear" onclick="clearSketch()">🗑️ נקה</button>
          </div>
          <canvas id="sketch-canvas" class="sketch-canvas"></canvas>
        </div>

        <div class="modal-actions">
          ${note.id ? `<button class="btn-danger" onclick="deleteNoteFromModal()">מחק</button>` : ''}
          <button class="btn-secondary" onclick="closeNoteModal()">ביטול</button>
          <button class="btn-primary" onclick="saveNote()">שמור</button>
        </div>
      </div>
    </div>`);

  document.getElementById('note-modal-bd').addEventListener('click', e => {
    if (e.target.id === 'note-modal-bd') closeNoteModal();
  });

  // Canvas is visible by default — init after DOM paint
  requestAnimationFrame(() => {
    initSketchCanvas(note.sketchData);
    sketchInitialized = true;
  });
};

const closeNoteModal = () => {
  if (recognition && recognitionTarget === 'note') { try { recognition.stop(); } catch(e){} }
  document.getElementById('note-modal-bd')?.remove();
  editingNoteId = null; sketchCtx = null; sketchInitialized = false;
};

const saveNote = () => {
  const content = document.getElementById('note-textarea')?.value || '';
  let note = notes.find(n => n.id === editingNoteId);
  if (!note) { note = { id: uid(), createdAt: new Date().toISOString() }; notes.unshift(note); }
  note.content   = content;
  note.updatedAt = new Date().toISOString();
  if (sketchInitialized && sketchCtx) {
    const canvas = document.getElementById('sketch-canvas');
    note.sketchData = canvas ? canvas.toDataURL('image/png') : note.sketchData;
  }
  saveNotes(); closeNoteModal(); renderAll(); showToast('פתק נשמר ✓');
};

const deleteNoteFromModal = () => { if (editingNoteId) { deleteNote(editingNoteId); closeNoteModal(); } };

// Note tabs
const switchNoteTab = tab => {
  document.querySelectorAll('.note-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('note-tab-text').style.display   = tab === 'text'   ? '' : 'none';
  document.getElementById('note-tab-sketch').style.display = tab === 'sketch' ? '' : 'none';
  if (tab === 'text') document.getElementById('note-textarea')?.focus();
};

// ===== SKETCH ENGINE =====
const initSketchCanvas = existingData => {
  const canvas = document.getElementById('sketch-canvas');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth;
  const h = 260;
  canvas.width  = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  sketchCtx = canvas.getContext('2d');
  sketchCtx.scale(dpr, dpr);
  sketchCtx.lineCap  = 'round';
  sketchCtx.lineJoin = 'round';
  sketchCtx.fillStyle = '#ffffff';
  sketchCtx.fillRect(0, 0, w, h);

  if (existingData) {
    const img = new Image();
    img.onload = () => sketchCtx.drawImage(img, 0, 0, w, h);
    img.src = existingData;
  }

  canvas.addEventListener('touchstart',  onSketchStart, { passive: false });
  canvas.addEventListener('touchmove',   onSketchMove,  { passive: false });
  canvas.addEventListener('touchend',    onSketchEnd);
  canvas.addEventListener('mousedown',   onSketchMouseDown);
  canvas.addEventListener('mousemove',   onSketchMouseMove);
  canvas.addEventListener('mouseup',     () => { isDrawing = false; lastPos = null; });
  canvas.addEventListener('mouseleave',  () => { isDrawing = false; lastPos = null; });
};

const canvasPos = (canvas, clientX, clientY) => {
  const r = canvas.getBoundingClientRect();
  return { x: clientX - r.left, y: clientY - r.top };
};
const drawLine = (from, to) => {
  if (!sketchCtx) return;
  sketchCtx.beginPath();
  sketchCtx.moveTo(from.x, from.y);
  sketchCtx.lineTo(to.x, to.y);
  sketchCtx.strokeStyle = sketchMode === 'eraser' ? '#ffffff' : sketchPenColor;
  sketchCtx.lineWidth   = sketchMode === 'eraser' ? sketchPenSize * 4 : sketchPenSize;
  sketchCtx.stroke();
};

const onSketchStart = e => {
  e.preventDefault();
  isDrawing = true;
  const canvas = e.target;
  const t = e.touches[0];
  lastPos = canvasPos(canvas, t.clientX, t.clientY);
  drawLine(lastPos, lastPos);
};
const onSketchMove = e => {
  e.preventDefault();
  if (!isDrawing) return;
  const canvas = e.target;
  const t = e.touches[0];
  const pos = canvasPos(canvas, t.clientX, t.clientY);
  drawLine(lastPos, pos); lastPos = pos;
};
const onSketchEnd = () => { isDrawing = false; lastPos = null; };

const onSketchMouseDown = e => {
  isDrawing = true;
  lastPos   = canvasPos(e.target, e.clientX, e.clientY);
  drawLine(lastPos, lastPos);
};
const onSketchMouseMove = e => {
  if (!isDrawing) return;
  const pos = canvasPos(e.target, e.clientX, e.clientY);
  drawLine(lastPos, pos); lastPos = pos;
};

const setSketchMode  = m => {
  sketchMode = m;
  document.getElementById('sk-pen')?.classList.toggle('active', m==='pen');
  document.getElementById('sk-eraser')?.classList.toggle('active', m==='eraser');
};
const setSketchColor = c => {
  sketchPenColor = c; sketchMode = 'pen';
  document.querySelectorAll('.sketch-color').forEach(el =>
    el.classList.toggle('active', el.style.background === c || el.style.backgroundColor === c)
  );
  setSketchMode('pen');
};
const setSketchSize  = s => {
  sketchPenSize = s;
  document.querySelectorAll('.sketch-size').forEach((el, i) =>
    el.classList.toggle('active', [2,4,8][i] === s)
  );
};
const clearSketch = () => {
  if (!sketchCtx) return;
  const canvas = document.getElementById('sketch-canvas');
  sketchCtx.fillStyle = '#ffffff';
  sketchCtx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
};

// ===== RENDER =====
const renderAll = () => {
  updateInputBar();
  document.getElementById('main-content').innerHTML =
    renderViewToggle() + (view === 'notes' ? renderNotesView() : renderCalendar() + renderTaskSection());
};

const renderViewToggle = () => `
  <div class="view-toggle">
    <button class="view-btn ${view==='list'  ?'active':''}"  onclick="setView('list')">רשימה</button>
    <button class="view-btn ${view==='day'   ?'active':''}"  onclick="setView('day')">יום</button>
    <button class="view-btn ${view==='week'  ?'active':''}"  onclick="setView('week')">שבוע</button>
    <button class="view-btn ${view==='month' ?'active':''}"  onclick="setView('month')">חודש</button>
    <button class="view-btn ${view==='notes' ?'active notes-active':''}" onclick="setView('notes')">📝 פתקים</button>
  </div>`;

const setView = v => {
  view = v; calOffset = 0;
  localStorage.setItem('mytasks_view', v);
  renderAll();
};

// ===== CALENDAR =====
const renderCalendar = () => {
  if (view === 'list')  return '';
  if (view === 'week')  return renderWeek();
  if (view === 'month') return renderMonth();
  if (view === 'day')   return renderDayNav();
  return '';
};

const navLabel = () => {
  if (view === 'week') {
    const ws = getWeekStart(calOffset);
    const we = new Date(ws); we.setDate(we.getDate() + 6);
    return ws.getMonth() === we.getMonth()
      ? `${ws.getDate()}–${we.getDate()} ${MONTHS_HE[ws.getMonth()]} ${ws.getFullYear()}`
      : `${ws.getDate()} ${MONTHS_HE[ws.getMonth()]} – ${we.getDate()} ${MONTHS_HE[we.getMonth()]}`;
  }
  if (view === 'month') { const ms = getMonthStart(calOffset); return `${MONTHS_HE[ms.getMonth()]} ${ms.getFullYear()}`; }
  if (view === 'day')   return selectedDate.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return '';
};

const renderWeek = () => {
  const ws = getWeekStart(calOffset), t0 = today();
  let cols = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(ws); d.setDate(d.getDate() + i);
    const isTod = sameDay(d, t0), isSel = sameDay(d, selectedDate);
    const dots = tasksOnDate(d).slice(0,3).map(t => `<span class="day-dot" style="background:${t.color||'#8E8E93'}"></span>`).join('');
    cols += `<div class="day-col">
      <span class="day-label">${DOW[i]}</span>
      <div class="day-num ${isTod?'today':''} ${isSel&&!isTod?'selected':''}" onclick="selectDay(${d.getTime()})">${d.getDate()}</div>
      <div class="day-dot-row">${dots}</div>
    </div>`;
  }
  return `<div class="cal-nav">
    <button class="nav-arrow" onclick="changeOffset(1)">‹</button>
    <h2>${navLabel()}</h2>
    <button class="nav-arrow" onclick="changeOffset(-1)">›</button>
  </div>
  <div class="week-grid">${cols}</div>`;
};

const renderMonth = () => {
  const ms = getMonthStart(calOffset), t0 = today();
  const year = ms.getFullYear(), month = ms.getMonth();
  const firstDow = ms.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrev  = new Date(year, month, 0).getDate();
  const dowHdr = DOW.map(d=>`<div class="month-dow">${d}</div>`).join('');
  let cells = '';
  for (let i = 0; i < 42; i++) {
    let day, isOther=false, date;
    if (i < firstDow)
      { day=daysInPrev-firstDow+i+1; isOther=true; date=new Date(year,month-1,day); }
    else if (i >= firstDow+daysInMonth)
      { day=i-firstDow-daysInMonth+1; isOther=true; date=new Date(year,month+1,day); }
    else
      { day=i-firstDow+1; date=new Date(year,month,day); }
    const isTod=sameDay(date,t0), isSel=sameDay(date,selectedDate);
    const dots=tasksOnDate(date).slice(0,3).map(t=>`<span class="mdot" style="background:${t.color||'#8E8E93'}"></span>`).join('');
    cells+=`<div class="month-cell ${isOther?'other-month':''} ${isTod?'today':''} ${isSel&&!isTod?'selected':''}" onclick="selectDay(${date.getTime()})">
      <div class="mn">${day}</div><div class="mdots">${dots}</div>
    </div>`;
  }
  return `<div class="cal-nav">
    <button class="nav-arrow" onclick="changeOffset(1)">‹</button>
    <h2>${navLabel()}</h2>
    <button class="nav-arrow" onclick="changeOffset(-1)">›</button>
  </div>
  <div class="month-grid">
    <div class="month-dow-row">${dowHdr}</div>
    <div class="month-days-grid">${cells}</div>
  </div>`;
};

const renderDayNav = () => `
  <div class="cal-nav">
    <button class="nav-arrow" onclick="changeOffset(1)">‹</button>
    <h2>${navLabel()}</h2>
    <button class="nav-arrow" onclick="changeOffset(-1)">›</button>
  </div>
  ${renderDayList()}`;

const renderDayList = () => {
  const dayTasks = tasksOnDate(selectedDate).sort((a, b) => {
    if (a.dueDate && b.dueDate) return new Date(a.dueDate) - new Date(b.dueDate);
    if (a.dueDate) return -1; if (b.dueDate) return 1; return 0;
  });
  return renderTaskCards(dayTasks);
};

const selectDay = ts => { selectedDate = new Date(ts); renderAll(); };
const changeOffset = delta => {
  if (view === 'day') selectedDate.setDate(selectedDate.getDate() + delta);
  else calOffset += delta;
  renderAll();
};

// ===== TASK SECTION =====
const renderTaskSection = () => {
  let filtered;
  if (view === 'list') {
    filtered = [...tasks].sort((a,b) => {
      if (a.dueDate && b.dueDate) return new Date(a.dueDate)-new Date(b.dueDate);
      if (a.dueDate) return -1; if (b.dueDate) return 1;
      return new Date(b.createdAt)-new Date(a.createdAt);
    });
  } else {
    filtered = tasksOnDate(selectedDate);
  }
  if (view === 'day') return '';
  if (view !== 'list') {
    const label = selectedDate.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
    return `<div class="section-header">משימות – ${label}</div>` + renderTaskCards(filtered);
  }
  const withDate = filtered.filter(t=>t.dueDate), noDate = filtered.filter(t=>!t.dueDate);
  let out = '';
  if (withDate.length) out += '<div class="section-header">עם תאריך</div>' + renderTaskCards(withDate);
  if (noDate.length)   out += '<div class="section-header">ללא תאריך</div>' + renderTaskCards(noDate);
  if (!filtered.length) out = `<div class="empty"><div class="icon">📋</div><p>אין משימות עדיין</p></div>`;
  return out;
};

const renderTaskCards = list => {
  if (!list.length) return `<div class="empty"><div class="icon">✨</div><p>אין משימות ביום זה</p></div>`;
  return `<div class="task-list">${list.map(renderTask).join('')}</div>`;
};

const renderTask = t => {
  const cat   = t.category ? CAT_MAP[t.category] : null;
  const color = t.color || '#8E8E93';
  const recurLabel = { daily:'יומי', weekly:'שבועי', monthly:'חודשי', yearly:'שנתי' };
  const tag        = cat ? `<span class="task-tag" style="background:${color}">${cat.emoji} ${cat.label}</span>` : '';
  const recurBadge = t.recurrence ? `<span class="rec-badge">🔁 ${recurLabel[t.recurrence]}</span>` : '';
  const schedStr   = t.dueDate    ? `<span class="task-time">📅 ${fmtDateTime(t.dueDate)}</span>`   : '';
  const notifStr   = t.notifDate  ? `<span class="task-time">🔔 ${fmtDateTime(t.notifDate)}</span>` : '';
  const linkEl     = t.link ? `<a class="task-link" href="${escHtml(t.link)}" target="_blank" onclick="event.stopPropagation()">🔗 קישור</a>` : '';
  const created    = `<span class="task-time">🕐 ${fmtDateTime(t.createdAt)}</span>`;
  return `<div class="task-card ${t.done?'done':''}" style="border-right-color:${color}" onclick="openEditModal('${t.id}')">
    <div class="task-check ${t.done?'checked':''}" onclick="toggleDone('${t.id}',event)">${t.done?'✓':''}</div>
    <div class="task-body">
      <div class="task-title">${escHtml(t.title)}</div>
      <div class="task-meta">${tag}${recurBadge}${linkEl}</div>
      ${schedStr  ? `<div class="task-meta">${schedStr}</div>`  : ''}
      ${notifStr  ? `<div class="task-meta">${notifStr}</div>`  : ''}
      <div class="task-meta">${created}</div>
    </div>
    <div class="task-actions">
      <button class="action-btn" onclick="event.stopPropagation();deleteTask('${t.id}')" title="מחק">🗑️</button>
    </div>
  </div>`;
};

// ===== NOTES VIEW =====
const renderNotesView = () => {
  if (!notes.length) return `<div class="empty"><div class="icon">📝</div><p>אין פתקים עדיין<br>לחץ + להוספת פתק חדש</p></div>`;
  const sorted = [...notes].sort((a,b) => new Date(b.updatedAt||b.createdAt) - new Date(a.updatedAt||a.createdAt));
  return `<div class="section-header">כל הפתקים (${notes.length})</div>
    <div class="note-list">${sorted.map(renderNoteCard).join('')}</div>`;
};

const renderNoteCard = n => {
  const title   = escHtml(noteTitle(n));
  const preview = escHtml(notePreview(n));
  const meta    = `עודכן: ${fmtDateTime(n.updatedAt||n.createdAt)}`;
  const thumb   = n.sketchData ? `<img class="note-sketch-thumb" src="${n.sketchData}" alt="סקיצה">` : '';
  return `<div class="note-card" onclick="openNoteModal('${n.id}')">
    <div class="note-icon">📝</div>
    <div class="note-body">
      <div class="note-card-title">${title}</div>
      ${preview ? `<div class="note-card-preview">${preview}</div>` : ''}
      <div class="note-card-meta">${meta}</div>
    </div>
    ${thumb}
    <div class="task-actions">
      <button class="action-btn" onclick="event.stopPropagation();deleteNote('${n.id}')" title="מחק">🗑️</button>
    </div>
  </div>`;
};

// ===== INIT =====
renderAll();

// On first load: fire overdue, then schedule all future
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.ready.then(reg => {
    swReg = reg;
    checkOverdueNotifs();
    tasks.forEach(t => { if ((t.notifDate || t.dueDate) && !t.done) scheduleNotif(t); });
  });
} else {
  checkOverdueNotifs();
  tasks.forEach(t => { if ((t.notifDate || t.dueDate) && !t.done) scheduleNotif(t); });
}
</script>
</body>
